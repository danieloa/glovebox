# SPDX-License-Identifier: Apache-2.0
# Five deliberate, independent faults — the test fixture for the toolkit.
#
#   1. checkout  CrashLoopBackOff        process exits 1 after logging a cause
#   2. catalog   ImagePullBackOff        tag does not exist
#   3. reports   Pending                 unschedulable resource request
#   4. web       Running but 0/1         readiness probe on the wrong port
#   5. payments  Service with 0 endpoints  selector says app=payment, pods say app=payments
#
# Faults 4 and 5 are the interesting pair: both produce an unreachable Service,
# and `kubectl get svc` cannot tell them apart. kt-net separates them.
#
#   kind create cluster --name ws-selftest
#   kubectl apply -f hack/selftest-faults.yaml
apiVersion: v1
kind: Namespace
metadata: {name: shop}
---
# FAULT 1: CrashLoopBackOff — process exits non-zero after 2s
apiVersion: apps/v1
kind: Deployment
metadata: {name: checkout, namespace: shop}
spec:
  replicas: 1
  selector: {matchLabels: {app: checkout}}
  template:
    metadata: {labels: {app: checkout}}
    spec:
      containers:
      - name: app
        image: busybox:1.36
        command: ["sh","-c","echo 'FATAL: cannot connect to postgres://db:5432'; sleep 2; exit 1"]
---
# FAULT 2: ImagePullBackOff — tag does not exist
apiVersion: apps/v1
kind: Deployment
metadata: {name: catalog, namespace: shop}
spec:
  replicas: 1
  selector: {matchLabels: {app: catalog}}
  template:
    metadata: {labels: {app: catalog}}
    spec:
      containers:
      - name: app
        image: nginx:1.99-does-not-exist
---
# FAULT 3: Pending — unschedulable resource request
apiVersion: apps/v1
kind: Deployment
metadata: {name: reports, namespace: shop}
spec:
  replicas: 1
  selector: {matchLabels: {app: reports}}
  template:
    metadata: {labels: {app: reports}}
    spec:
      containers:
      - name: app
        image: busybox:1.36
        command: ["sleep","3600"]
        resources: {requests: {memory: "900Gi", cpu: "200"}}
---
# FAULT 4: readiness probe fails -> Running but 0/1 -> Service has no endpoints
apiVersion: apps/v1
kind: Deployment
metadata: {name: web, namespace: shop}
spec:
  replicas: 2
  selector: {matchLabels: {app: web}}
  template:
    metadata: {labels: {app: web}}
    spec:
      containers:
      - name: app
        image: nginx:1.27-alpine
        ports: [{containerPort: 80}]
        readinessProbe:
          httpGet: {path: /healthz, port: 8080}
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata: {name: web, namespace: shop}
spec:
  selector: {app: web}
  ports: [{port: 80, targetPort: 80}]
---
# FAULT 5: the Service selector says app=payment; the pods are labelled
# app=payments. One character, permanently zero endpoints, and `get svc`,
# `get deploy` and `get pods` all look completely healthy.
apiVersion: apps/v1
kind: Deployment
metadata: {name: payments, namespace: shop}
spec:
  replicas: 1
  selector: {matchLabels: {app: payments}}
  template:
    metadata: {labels: {app: payments}}
    spec:
      containers:
      - name: app
        image: nginx:1.27-alpine
        ports: [{containerPort: 80}]
---
apiVersion: v1
kind: Service
metadata: {name: payments, namespace: shop}
spec:
  selector: {app: payment}
  ports: [{port: 80, targetPort: 80}]
