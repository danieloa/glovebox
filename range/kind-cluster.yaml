# The range cluster: one control plane and two workers.
#
# Three nodes rather than one because a third of the interesting failures are
# not expressible on a single node. A taint you cannot schedule around, a node
# that goes NotReady while the cluster survives to be diagnosed, a PersistentVolume
# pinned to a zone the pod is not allowed into — all of them need somewhere else
# for the pod to have gone.
#
# The zone labels exist for that last one: WaitForFirstConsumer binds a volume to
# whichever node the pod landed on, and the topology scenario is only a scenario
# if there is a second zone for the pod to be pushed towards.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: gb-range
nodes:
  - role: control-plane
  - role: worker
    labels:
      topology.kubernetes.io/zone: zone-a
      gb-range/worker: "1"
  - role: worker
    labels:
      topology.kubernetes.io/zone: zone-b
      gb-range/worker: "2"
